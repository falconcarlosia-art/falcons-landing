# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  # Lo que se publica desde /admin vive en Supabase y solo llega al HTML
  # prerenderizado y al sitemap en un build. Sin esto, un producto/servicio
  # nuevo queda invisible para los crawlers hasta el siguiente commit.
  workflow_dispatch:
  repository_dispatch:
    types: [publish]
  schedule:
    - cron: "0 10 * * *" # 05:00 hora de Lima, diario
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALCONS_LANDING_E3CEA }}
          channelId: live
          projectId: falcons-landing-e3cea
